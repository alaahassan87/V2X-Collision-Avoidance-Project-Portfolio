<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2X Collision Avoidance — Project Portfolio</title>
<meta name="description" content="V2X Collision Avoidance — graduation project: videos, source code, book, proposal, presentation and team.">
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#00041a;--bg2:#050d2b;--card:#0b1638;--line:#1d2f64;--tx:#eaf1ff;--mut:#8fa3cc;--c1:#2fd4ff;--c2:#2ecc71;--c3:#f5a623;--sh:0 10px 40px #0008;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#00041a;--bg2:#050d2b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(900px 500px at 15% -10%,#2fd4ff1f,transparent),radial-gradient(800px 500px at 100% 10%,#2ecc711a,transparent),linear-gradient(var(--bg),var(--bg2))}
.bg i{position:absolute;left:50%;top:22%;width:900px;height:900px;margin:-450px;border-radius:50%;border:1px solid var(--c1);opacity:0;animation:p 7s infinite}
.bg i:nth-child(2){animation-delay:2.3s}.bg i:nth-child(3){animation-delay:4.6s}
@keyframes p{0%{transform:scale(.1);opacity:.3}100%{transform:scale(1);opacity:0}}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:18px 18px 60px}
.hero{text-align:center;padding:0 0 26px}
.logo{width:min(380px,78vw);height:auto;display:block;margin:0 auto;-webkit-mask-image:radial-gradient(circle,#000 56%,transparent 71%);mask-image:radial-gradient(circle,#000 56%,transparent 71%)}
h1{margin:-6px 0 8px;font-size:clamp(30px,6.4vw,58px);letter-spacing:-1px;line-height:1.05;background:linear-gradient(90deg,var(--c1),var(--c2) 55%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:clamp(15px,2.4vw,19px);max-width:640px;margin:0 auto}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.chips span{font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:.2s;position:relative;overflow:hidden}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--a)}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 0 0,var(--a),transparent);opacity:.16}
.tile .go{position:absolute;right:16px;top:16px;color:var(--mut);font-size:18px}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);position:relative}
.ic svg{width:30px;height:30px}
.tile b{font-size:19px;position:relative}.tile small{color:var(--mut);position:relative;line-height:1.4}
dialog{border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:22px;padding:0;width:min(720px,94vw);max-height:90vh;box-shadow:var(--sh)}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
.dh h2{margin:0;font-size:20px}.x{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.db{padding:18px 20px 22px;display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--tx);transition:.2s}
.card:hover{border-color:var(--a);transform:translateX(3px)}
.card .ic{flex:none}.card b{display:block}.card small{color:var(--mut)}.card .ar{margin-left:auto;color:var(--a);font-size:20px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mem>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#041022;background:linear-gradient(135deg,var(--c1),var(--c2))}
.mb{display:none;padding:0 14px 14px;flex-direction:column;gap:10px}.mem.open .mb{display:flex}
.soc{display:flex;gap:8px;flex-wrap:wrap}.soc a{height:42px;min-width:42px;padding:0 12px;border-radius:12px;display:inline-flex;gap:6px;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);text-decoration:none;font-weight:700;font-size:14px}.soc svg{width:22px;height:22px}
.note{color:var(--mut);font-size:13px;line-height:1.5}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
<section class="hero">
<img class="logo" src="logo.jpg" alt="V2X Collision Avoidance logo">
<h1>V2X Collision Avoidance</h1>
<p class="sub">An intelligent connected-vehicle safety system — vehicles that talk to vehicles, roads, pedestrians and the cloud to prevent accidents.</p>
<div class="chips"><span style="color:var(--c1)">V2V</span><span style="color:var(--c2)">V2I</span><span style="color:var(--c3)">V2P</span><span style="color:#b69cff">V2N</span></div>
</section>
<div class="grid" id="grid"></div>
<footer>Scan · Explore · Build safer roads — Faculty of Engineering, Al-Azhar University</footer>
</main>
<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button class="x" onclick="dlg.close()" aria-label="Close">✕</button></div><div class="db" id="dbody"></div></dialog>

<script>
const L={
 github:"https://github.com/abdallah-shehawey/V2X-Collision-Avoidance",
 book:"https://drive.google.com/file/d/10w2z-pFUgIFojzMcDTiI1nJpQWCtieOy/view?usp=drive_link",
 ppt:"https://docs.google.com/presentation/d/1N1u1jD_1bSlp78u0K3wY2TMn1zP2_6rw/edit?usp=drive_link&ouid=115929944339653326492&rtpof=true&sd=true",
 proposal:"https://drive.google.com/drive/u/1/folders/1p4QaFPvr986LeghMszo853w0tCgX9vlX",
 cvs:"https://drive.google.com/drive/folders/1FMxGhr1CRHgRdJEapMj0y39sZjf7KJIe?usp=drive_link"
};
const S=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f?"currentColor":"none"}" stroke="${f?"none":"currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 vid:S('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/>'),
 git:S('<path d="M12 2a10 10 0 0 0-3.200 19.500c.5.100.7-.2.7-.5v-1.800c-2.800.6-3.400-1.200-3.400-1.200-.5-1.100-1.100-1.400-1.100-1.400-.9-.6.1-.6.1-.6 1 .1 1.500 1 1.500 1 .9 1.500 2.400 1.100 2.900.8.1-.7.4-1.100.6-1.400-2.200-.3-4.600-1.100-4.600-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.700 1a9.400 9.400 0 0 1 5 0c1.900-1.300 2.700-1 2.700-1 .5 1.400.2 2.400.1 2.700.6.7 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.3.7.9.7 1.900v2.800c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/>',1),
 book:S('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>'),
 prop:S('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>'),
 ppt:S('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 12l3-3 3 2 4-4"/>'),
 team:S('<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0M16 4.500a3.500 3.500 0 0 1 0 7M18 14a6 6 0 0 1 3.500 6"/>'),
 in:S('<path d="M4.500 3A1.800 1.800 0 1 0 4.500 6.600 1.800 1.800 0 0 0 4.500 3zM3 8.500h3V21H3zM9 8.500h2.800v1.700c.5-.9 1.600-2 3.500-2 3.400 0 4 2.200 4 5.100V21h-3v-6.500c0-1.500 0-3.300-2-3.300s-2.300 1.600-2.300 3.200V21H9z"/>',1),
 wa:S('<path d="M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-1.900.9-2.200.2-.2.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .6l-.4.600-.3.300c-.1.200-.2.300-.1.600.2.300.7 1.200 1.600 1.900 1.100 1 2 1.300 2.300 1.400.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/>',1),
 mail:S('<rect x="3" y="5" width="18" height="14" rx="2.500"/><path d="m3.500 7.500 8.500 6 8.500-6"/>'),
 cv:S('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>')
};
const SECS=[
 {t:"Videos",d:"Demos, tests and project walkthroughs",i:"vid",a:"#ff4d4f",modal:"videos"},
 {t:"Source Code",d:"Full source on GitHub",i:"git",a:"#9aa8ff",link:L.github},
 {t:"Graduation Book",d:"The complete project report",i:"book",a:"#2fd4ff",link:L.book},
 {t:"Proposal",d:"Project proposal documents",i:"prop",a:"#f5a623",link:L.proposal},
 {t:"Presentation",d:"Slides of the project defense",i:"ppt",a:"#2ecc71",link:L.ppt},
 {t:"Team & CVs",d:"Meet the 8 engineers behind V2X",i:"team",a:"#b69cff",modal:"team"}
];
const VIDEOS=[
 ["V2V — Main System","Vehicle-to-vehicle safety engine demos","https://drive.google.com/drive/folders/1zzQJas7tzVl8UBuSS9cEbgz_OvqvFxZJ?usp=drive_link","#ff4d4f"],
 ["V2P & V2I","Pedestrian detection and traffic-light integration","https://drive.google.com/drive/folders/18Ox_5uLxpNE0xLdcI_aygW7hp5laYEDl?usp=drive_link","#f5a623"],
 ["V2N & V2I","Cloud network, gateway and infrastructure","https://drive.google.com/drive/folders/1Eg3F1sYSH3qNo43MVYnCSTm1rIvR5BVX?usp=drive_link","#b69cff"]
];
const TEAM=[
 ["Abdallah AbdelMomen Abdallah","01501899476","http://www.linkedin.com/in/abdallah-shehawey","shehawey9@gmail.com"],
 ["Abdallah Saleh Mohamed","01126740033","https://www.linkedin.com/in/abd-allahsaleh","abdallahsalehmohamed393@gmail.com"],
 ["Ahmad Gamal Ali","01006872317","https://www.linkedin.com/in/ahmadgamalmansour","ag5580386@gmail.com"],
 ["Alaa Hassan Wanas","01099118093","https://www.linkedin.com/in/alaa-hassan-647a35263/","alaahassan0591@gmail.com","cv/Alaa_Hassan_CV.pdf"],
 ["Amira Atef Roshdy","01091860768","https://www.linkedin.com/in/amira-atef-614463258/","amiraatef1572003@gmail.com"],
 ["Aya Gamal Taha","01287883101","http://www.linkedin.com/in/ayagamalpro","ayagamal87eg@gmail.com"],
 ["Gamila Adel Mohamed","01207760389","https://www.linkedin.com/in/gamila-elkomy-1556a82a1","gamilaelkomy@gmail.com"],
 ["Asmaa Saad Fouda","01154756255","https://www.linkedin.com/in/asmaa-saad-4a7bb3269","Saaa299187@gmail.com"]
];
const $=s=>document.querySelector(s),dlg=$("#dlg");
const el=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#grid").append(...SECS.map(s=>{
  const b=el(`<button class="tile" style="--a:${s.a}"><span class="go">${s.link?"↗":"›"}</span><div class="ic">${I[s.i]}</div><b>${s.t}</b><small>${s.d}</small></button>`);
  b.onclick=()=>s.link?window.open(s.link,"_blank","noopener"):show(s);return b}));

function show(s){
  $("#dt").textContent=s.t;const b=$("#dbody");b.innerHTML="";
  if(s.modal==="videos") VIDEOS.forEach(v=>b.append(el(`<a class="card" style="--a:${v[3]}" href="${v[2]}" target="_blank" rel="noopener"><div class="ic" style="--a:${v[3]}">${I.vid}</div><div><b>${v[0]}</b><small>${v[1]}</small></div><span class="ar">↗</span></a>`)));
  else{
    b.append(el(`<a class="card" style="--a:#b69cff" href="${L.cvs}" target="_blank" rel="noopener"><div class="ic" style="--a:#b69cff">${I.cv}</div><div><b>All team CVs</b><small>Open the shared CV folder</small></div><span class="ar">↗</span></a>`));
    TEAM.forEach(m=>{
      const ph="2"+m[1],cv=m[4]||L.cvs;
      const c=el(`<div class="mem"><button><div class="av">${esc(m[0][0])}</div><b style="flex:1">${esc(m[0])}</b><span class="note">▾</span></button><div class="mb">
        <div class="soc"><a style="--c:#4aa6ff" href="${m[2]}" target="_blank" rel="noopener" title="LinkedIn">${I.in}</a><a style="--c:#2ecc71" href="https://wa.me/${ph}" target="_blank" rel="noopener" title="WhatsApp">${I.wa}</a><a style="--c:#f5a623" href="mailto:${m[3]}" title="Email">${I.mail}</a><a style="--c:#b69cff" href="${cv}" target="_blank" rel="noopener" title="CV">${I.cv} CV</a></div>
        <div class="note">${esc(m[1])} · ${esc(m[3])}</div></div></div>`);
      c.querySelector("button").onclick=()=>c.classList.toggle("open");b.append(c)});
  }
  dlg.showModal();
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
