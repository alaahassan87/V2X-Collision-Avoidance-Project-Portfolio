<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2X Collision Avoidance — Project Portfolio</title>
<style>
:root{--bg:#070d1a;--bg2:#0d1730;--card:#111c38;--line:#22325c;--tx:#eaf1ff;--mut:#8fa3cc;--c1:#2fd4ff;--c2:#2ecc71;--c3:#f5a623;--c4:#ff4d4f;--sh:0 10px 40px #0008;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fc;--bg2:#fff;--card:#fff;--line:#cfdaf1;--tx:#0e1b3a;--mut:#51648e;--sh:0 10px 30px #1b2c5a22}}
:root[data-theme="light"]{--bg:#eef3fc;--bg2:#fff;--card:#fff;--line:#cfdaf1;--tx:#0e1b3a;--mut:#51648e;--sh:0 10px 30px #1b2c5a22}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(900px 500px at 15% -10%,#2fd4ff22,transparent),radial-gradient(800px 500px at 100% 10%,#2ecc7122,transparent),linear-gradient(var(--bg),var(--bg2))}
.bg i{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px;border-radius:50%;border:1px solid var(--c1);opacity:0;animation:p 6s infinite}
.bg i:nth-child(2){animation-delay:2s}.bg i:nth-child(3){animation-delay:4s}
@keyframes p{0%{transform:scale(.1);opacity:.35}100%{transform:scale(1);opacity:0}}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;justify-content:flex-end}
.top button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.hero{text-align:center;padding:18px 0 30px}
.logo{width:118px;height:118px;filter:drop-shadow(0 0 22px #2fd4ff66)}
h1{margin:14px 0 6px;font-size:clamp(34px,7vw,64px);letter-spacing:-1px;line-height:1.05;background:linear-gradient(90deg,var(--c1),var(--c2) 55%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:clamp(15px,2.4vw,19px);max-width:640px;margin:0 auto}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.chips span{font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:.2s;position:relative;overflow:hidden}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--a)}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 0 0,var(--a),transparent);opacity:.16}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);position:relative}
.ic svg{width:30px;height:30px}
.tile b{font-size:19px;position:relative}.tile small{color:var(--mut);position:relative;line-height:1.4}
dialog{border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:22px;padding:0;width:min(760px,94vw);max-height:90vh;box-shadow:var(--sh)}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
.dh h2{margin:0;font-size:20px}.x{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.db{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--a,var(--c1));color:#041022;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none;font-size:14px}
.btn.o{background:none;border:1px solid var(--line);color:var(--tx)}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.it a{color:var(--c1);font-weight:600;word-break:break-word}.it small{color:var(--mut)}
video,iframe.pdf{width:100%;border-radius:12px;border:1px solid var(--line);background:#000}iframe.pdf{height:60vh;background:#fff}
.up{border:1px dashed var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.up input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px;font:inherit;width:100%}
.note{color:var(--mut);font-size:13px;line-height:1.5}
.mem{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mem>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#041022;background:linear-gradient(135deg,var(--c1),var(--c2))}
.mb{display:none;padding:0 14px 14px;gap:10px;flex-direction:column}.mem.open .mb{display:flex}
.soc{display:flex;gap:8px;flex-wrap:wrap}.soc a{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}.soc svg{width:22px;height:22px}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
<div class="top"><button id="th">◐ Theme</button></div>
<section class="hero">
<svg class="logo" viewBox="0 0 120 120" aria-label="V2X logo"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd4ff"/><stop offset=".6" stop-color="#2ecc71"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="6 5"/><circle cx="60" cy="60" r="40" fill="none" stroke="url(#g)" stroke-width="2" opacity=".6"/><path d="M28 40 46 82 56 58 66 82 84 40" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 -2) scale(.95)"/><path d="M78 44l22 30M100 44 78 74" stroke="url(#g)" stroke-width="6" stroke-linecap="round" transform="translate(-6 -2) scale(.9)"/></svg>
<h1>V2X Collision Avoidance</h1>
<p class="sub">An intelligent connected-vehicle safety system — vehicles that talk to vehicles, roads, pedestrians and the cloud to prevent accidents.</p>
<div class="chips"><span style="color:var(--c1)">V2V</span><span style="color:var(--c2)">V2I</span><span style="color:var(--c3)">V2P</span><span style="color:#b69cff">V2N</span></div>
</section>
<div class="grid" id="grid"></div>
<footer>Scan · Explore · Build safer roads 🚗 — Faculty of Engineering, Al-Azhar University</footer>
</main>
<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button class="x" onclick="dlg.close()">✕</button></div><div class="db" id="dbody"></div></dialog>

<script>
const GITHUB="https://github.com/abdallah-shehawey/V2X-Collision-Avoidance", DRIVE="https://drive.google.com/drive/folders/1zzQJas7tzVl8UBuSS9cEbgz_OvqvFxZJ?usp=drive_link", CVDRIVE="https://drive.google.com/drive/folders/1FMxGhr1CRHgRdJEapMj0y39sZjf7KJIe?usp=drive_link";
const I={
 vid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 git:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.700 1a9.400 9.400 0 0 1 5 0c1.900-1.300 2.700-1 2.700-1 .5 1.400.2 2.400.1 2.700.6.700 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.3.7.9.7 1.900v2.800c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/></svg>',
 prop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
 ppt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 12l3-3 3 2 4-4"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.500 6.500 0 0 1 13 0M16 4.500a3.500 3.500 0 0 1 0 7M18 14a6 6 0 0 1 3.500 6"/></svg>',
 in:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.500 3A1.800 1.800 0 1 0 4.500 6.600 1.800 1.800 0 0 0 4.500 3zM3 8.500h3V21H3zM9 8.500h2.800v1.700c.5-.9 1.600-2 3.500-2 3.400 0 4 2.200 4 5.100V21h-3v-6.500c0-1.500 0-3.300-2-3.300s-2.300 1.600-2.300 3.200V21H9z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-1.900.9-2.200.2-.2.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .6l-.4.600-.3.300c-.1.200-.2.300-.1.600.2.300.7 1.200 1.600 1.900 1.100 1 2 1.300 2.300 1.400.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>',
 mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.500"/><path d="m3.500 7.500 8.500 6 8.500-6"/></svg>',
 tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
 gh:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.200 19.500c.5.100.7-.200.700-.500v-1.800c-2.800.600-3.400-1.200-3.400-1.200-.5-1.100-1.100-1.400-1.100-1.400-.9-.6.100-.6.100-.6 1 .1 1.500 1 1.500 1 .9 1.500 2.400 1.100 2.900.8.100-.7.400-1.100.6-1.400-2.200-.3-4.600-1.100-4.600-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.700 1a9.400 9.400 0 0 1 5 0c1.900-1.300 2.700-1 2.700-1 .5 1.400.2 2.400.1 2.700.6.700 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.300.7.900.7 1.900v2.800c0 .300.200.600.700.500A10 10 0 0 0 12 2z"/></svg>'
};
const SECS=[
 {k:"videos",t:"Videos",d:"Demos, tests and project walkthroughs",i:"vid",a:"#ff4d4f",ext:[["Open Drive folder",DRIVE]]},
 {k:"code",t:"Source Code",d:"Full source on GitHub",i:"git",a:"#9aa8ff",link:GITHUB},
 {k:"book",t:"Graduation Book",d:"The complete project report",i:"book",a:"#2fd4ff"},
 {k:"proposal",t:"Proposal",d:"Project proposal document",i:"prop",a:"#f5a623"},
 {k:"ppt",t:"Presentation",d:"Slides of the project defense",i:"ppt",a:"#2ecc71"},
 {k:"team",t:"Team & CVs",d:"Meet the 8 engineers behind V2X",i:"team",a:"#b69cff"}
];
const TEAM=[
 ["Abdallah AbdelMomen Abdallah","01501899476","http://www.linkedin.com/in/abdallah-shehawey","shehawey9@gmail.com"],
 ["Abdallah Saleh Mohamed","01126740033","https://www.linkedin.com/in/abd-allahsaleh","abdallahsalehmohamed393@gmail.com"],
 ["Ahmad Gamal Ali","01006872317","https://www.linkedin.com/in/ahmadgamalmansour","ag5580386@gmail.com"],
 ["Alaa Hassan Wanas","01099118093","https://www.linkedin.com/in/alaa-hassan-647a35263/","alaahassan0591@gmail.com"],
 ["Amira Atef Roshdy","01091860768","https://www.linkedin.com/in/amira-atef-614463258/","amiraatef1572003@gmail.com"],
 ["Aya Gamal Taha","01287883101","http://www.linkedin.com/in/ayagamalpro","ayagamal87eg@gmail.com"],
 ["Gamila Adel Mohamed","01207760389","https://www.linkedin.com/in/gamila-elkomy-1556a82a1","gamilaelkomy@gmail.com"],
 ["Asmaa Saad Fouda","01154756255","https://www.linkedin.com/in/asmaa-saad-4a7bb3269","Saaa299187@gmail.com"]
];
const $=s=>document.querySelector(s);
let db=null,assets=null,uid=null,items=[];
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#grid").append(...SECS.map(s=>{const b=el(`<button class="tile" style="--a:${s.a}"><div class="ic">${I[s.i]}</div><b>${s.t}</b><small>${s.d}</small></button>`);b.onclick=()=>s.link?window.open(s.link,"_blank","noopener"):open(s);return b}));

async function init(){
  try{const c=window.claude; if(!c)return;
   db=await c.use("db"); assets=await c.use("assets");
   const u=await c.use("user"); if(u&&u.id) uid=await u.id();
   if(db) db.collection("items").onSnapshot(sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()}));if(dlg.open&&cur)render()});
  }catch(e){console.warn(e)}
}
init();

const dlg=$("#dlg");let cur=null;
function open(s){cur=s;$("#dt").textContent=s.t;render();dlg.showModal()}
function itemHtml(it){
  const u=it.url||"",isV=/\.(mp4|webm|mov)(\?|$)/i.test(u)||it.type==="video",isP=!it.compact&&(it.type==="application/pdf"||/\.pdf(\?|$)/i.test(u));
  const mine=uid&&it.by===uid;
  return `<div class="it" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(it.title||"Untitled")}</a>${mine?`<button class="btn o" data-del="${it.id}">Delete</button>`:""}</div>${isV?`<video controls preload="metadata" src="${esc(u)}"></video>`:isP?`<iframe class="pdf" src="${esc(u)}"></iframe>`:""}</div>`;
}
function uploader(sec,label,mode){
  if(!db||!assets) return `<p class="note">🔒 Uploading is for team members: open this page while signed in with your invited email to add files.</p>`;
  return `<div class="up" data-sec="${sec}"><b>${label}</b><input class="ut" placeholder="Title"><input class="uf" type="file"><input class="ul" placeholder="…or paste a link (Drive, YouTube, …)"><button class="btn go" style="--a:var(--c2)">Upload</button><span class="note us"></span></div>`;
}
function render(){
  const s=cur,b=$("#dbody");
  if(s.k==="team"){return renderTeam(b)}
  const list=items.filter(i=>i.sec===s.k).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let h="";
  if(s.ext) h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">${s.ext.map(e=>`<a class="btn" style="--a:${s.a}" target="_blank" rel="noopener" href="${e[1]}">${e[0]} ↗</a>`).join("")}</div>`;
  h+=list.length?list.map(itemHtml).join(""):`<p class="note">${db?"Nothing here yet — be the first to add one.":"Content will appear here."}</p>`;
  h+=uploader(s.k,"Add to "+s.t);
  b.innerHTML=h;wire(b);
}
function renderTeam(b){
  b.innerHTML=`<a class="btn" style="--a:#b69cff" target="_blank" rel="noopener" href="${CVDRIVE}">All CVs on Drive ↗</a><p class="note">Tap a name to see the CV and ways to get in touch.</p>`;
  TEAM.forEach((m,i)=>{
    const ph="2"+m[1],cv=items.find(x=>x.sec==="cv"&&x.m===i);
    const card=el(`<div class="mem"><button><div class="av">${m[0][0]}</div><b style="flex:1">${esc(m[0])}</b><span class="note">▾</span></button><div class="mb">
     <div class="soc"><a style="--c:#4aa6ff" href="${m[2]}" target="_blank" rel="noopener" title="LinkedIn">${I.in}</a><a style="--c:#2ecc71" href="https://wa.me/${ph}" target="_blank" rel="noopener" title="WhatsApp">${I.wa}</a><a style="--c:#f5a623" href="mailto:${m[3]}" title="Email">${I.mail}</a><a style="--c:#9aa8ff" href="${GITHUB}" target="_blank" rel="noopener" title="Project GitHub">${I.gh}</a></div>
     <div class="note">📞 ${m[1]} · ✉️ ${m[3]}</div>
     ${cv?itemHtml({...cv,title:"📄 CV — "+m[0],id:cv.id,compact:true}):`<p class="note">📄 CV: <a style="color:var(--c1)" href="${CVDRIVE}" target="_blank" rel="noopener">find it in the CVs Drive folder ↗</a></p>`}
     ${uploader("cv:"+i,cv?"Replace CV (PDF)":"Upload CV (PDF)")}</div></div>`);
    card.querySelector("button").onclick=()=>card.classList.toggle("open");
    b.append(card);wire(card);
  });
}
function wire(root){
  root.querySelectorAll("[data-del]").forEach(x=>x.onclick=async()=>{if(confirm("Delete this item?"))await db.doc("items/"+x.dataset.del).delete()});
  root.querySelectorAll(".up").forEach(u=>u.querySelector(".go").onclick=async()=>{
    const st=u.querySelector(".us"),f=u.querySelector(".uf").files[0],link=u.querySelector(".ul").value.trim(),sec=u.dataset.sec;
    let title=u.querySelector(".ut").value.trim()||(f&&f.name)||link;
    if(!f&&!link){st.textContent="Choose a file or paste a link.";return}
    try{
      st.textContent="Uploading…";let url=link,type="";
      if(f){const r=await assets.upload(f);url=r.url;type=r.contentType}
      const isCv=sec.startsWith("cv:"),m=isCv?+sec.split(":")[1]:undefined;
      const id=isCv?"cv"+m:"i"+Date.now().toString(36);
      const doc={sec:isCv?"cv":sec,title,url,type,by:uid||"",ts:Date.now()};if(isCv)doc.m=m;
      await db.doc("items/"+id).set(doc);st.textContent="Done ✓";
    }catch(e){st.textContent="Failed: "+(e.message||e.code||e)}
  });
}
$("#th").onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#070d1a";r.dataset.theme=dark?"light":"dark"};
</script>
</body>
</html>
